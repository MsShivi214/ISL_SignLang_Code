<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Baker</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .panes { display: flex; gap: 16px; flex-wrap: wrap; }
  .pane { flex: 1; min-width: 280px; }
  canvas#preview-3d { width: 100%; aspect-ratio: 1/1; border-radius: 8px; background: #eee; }
  video#source-video { width: 100%; border-radius: 8px; background: black; }
  select, input[type=text] { width: 100%; padding: 8px; margin: 6px 0; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; }
  #avatar-choice { display: flex; flex-wrap: wrap; gap: 16px; margin: 6px 0 12px; font-size: 0.95rem; }
  #avatar-choice label { display: flex; align-items: center; gap: 4px; cursor: pointer; width: auto; }
  progress { width: 100%; }
  #log { font-size: 0.8rem; white-space: pre-wrap; max-height: 160px; overflow-y: auto; opacity: 0.8; }
</style>
</head>
<body>
<main style="max-width: 900px;">
  <h1>Sign Baker</h1>
  <p>Runs pose + hand tracking on a recorded clip, retargets it onto the avatar skeleton, and saves it as a reusable sign animation.</p>

  <label>Source clip</label>
  <select id="video-select"></select>

  <label>Target avatar</label>
  <div id="avatar-choice">
    <label><input type="radio" name="avatar-type" value="glb" checked> GLB Avatar</label>
    <label><input type="radio" name="avatar-type" value="fbx"> FBX Avatar (Waving)</label>
    <label><input type="radio" name="avatar-type" value="fbx2"> FBX Avatar (New)</label>
  </div>

  <div class="panes">
    <div class="pane">
      <video id="source-video" muted playsinline></video>
    </div>
    <div class="pane">
      <canvas id="preview-3d"></canvas>
    </div>
  </div>

  <label><input type="checkbox" id="swap-hands"> Swap left/right hands (enable if the avatar's hands look mirrored)</label>
  <br><br>
  <button id="bake-button">Start baking</button>
  <progress id="bake-progress" value="0" max="100"></progress>

  <div id="save-row" hidden>
    <label>Sign name (this becomes the lookup key, e.g. "hello", "thank you")</label>
    <input type="text" id="sign-name">
    <button id="save-button">Save animation</button>
  </div>

  <div id="status"></div>
  <div id="log"></div>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import { FilesetResolver, PoseLandmarker, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
import {
  createAvatarScene,
  quaternionToArray,
} from "{{ url_for('static', filename='js/avatarScene.js') }}";
import { buildRestChildDirections, retargetFrame } from "{{ url_for('static', filename='js/retarget.js') }}";

const videoSelect = document.getElementById("video-select");
const video = document.getElementById("source-video");
const canvas3d = document.getElementById("preview-3d");
const avatarRadios = document.querySelectorAll('input[name="avatar-type"]');
const swapHandsBox = document.getElementById("swap-hands");
const bakeButton = document.getElementById("bake-button");
const progressEl = document.getElementById("bake-progress");
const saveRow = document.getElementById("save-row");
const signNameInput = document.getElementById("sign-name");
const saveButton = document.getElementById("save-button");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function log(msg) {
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

let bakedTracks = null;
let bakedDuration = 0;

const scenePromise = createAvatarScene(canvas3d, "glb");

for (const radio of avatarRadios) {
  radio.addEventListener("change", async (event) => {
    if (!event.target.checked) return;
    const ctx = await scenePromise;
    statusEl.textContent = "Loading avatar...";
    await ctx.switchAvatar(event.target.value);
    ctx.resetPose();
    ctx.render();
    statusEl.textContent = "";
  });
}

async function loadVideoList() {
  const res = await fetch("/api/videos");
  const videos = await res.json();
  videoSelect.innerHTML = "";
  for (const v of videos) {
    const opt = document.createElement("option");
    opt.value = v.url;
    opt.textContent = v.name;
    videoSelect.appendChild(opt);
  }
  if (videos.length) video.src = videos[0].url;
}
videoSelect.addEventListener("change", () => { video.src = videoSelect.value; });

function pushSampleQuat(tracks, boneName, t, quat) {
  if (!tracks[boneName]) tracks[boneName] = [];
  const [x, y, z, w] = quaternionToArray(quat);
  tracks[boneName].push([Number(t.toFixed(3)), Number(x.toFixed(4)), Number(y.toFixed(4)), Number(z.toFixed(4)), Number(w.toFixed(4))]);
}

async function bake() {
  const { bones, resetPose, render } = await scenePromise;
  const restDirs = buildRestChildDirections(bones);
  statusEl.textContent = "Loading models...";

  const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: "/static/models/pose_landmarker_lite.task" },
    runningMode: "VIDEO",
  });
  const handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: "/static/models/hand_landmarker.task" },
    runningMode: "VIDEO",
    numHands: 2,
  });

  await video.play();
  video.pause();
  if (!video.duration || Number.isNaN(video.duration)) {
    await new Promise((res) => { video.onloadedmetadata = res; });
  }

  resetPose();
  const duration = video.duration;
  const fps = 15;
  const step = 1 / fps;
  const tracks = {};
  const swap = swapHandsBox.checked;

  let t = 0;
  let framesWithPose = 0;
  let framesWithHand = 0;
  let totalFrames = 0;

  statusEl.textContent = "Baking...";
  while (t < duration) {
    video.currentTime = t;
    await new Promise((res) => { video.onseeked = res; });

    const timestampMs = Math.round(t * 1000);
    totalFrames++;

    const poseResult = poseLandmarker.detectForVideo(video, timestampMs);
    const poseLandmarks = poseResult.worldLandmarks[0] || null;
    if (poseLandmarks) framesWithPose++;

    const handResult = handLandmarker.detectForVideo(video, timestampMs);
    if (handResult.landmarks.length) framesWithHand++;
    let leftHandLandmarks = null;
    let rightHandLandmarks = null;
    for (let i = 0; i < handResult.worldLandmarks.length; i++) {
      const detected = handResult.handednesses[i][0].categoryName; // "Left" | "Right"
      const side = swap ? (detected === "Left" ? "Right" : "Left") : detected;
      if (side === "Left") leftHandLandmarks = handResult.worldLandmarks[i];
      else rightHandLandmarks = handResult.worldLandmarks[i];
    }

    const applied = retargetFrame(bones, restDirs, { poseLandmarks, leftHandLandmarks, rightHandLandmarks });
    for (const [boneName, quat] of Object.entries(applied)) {
      pushSampleQuat(tracks, boneName, t, quat);
    }

    render();
    progressEl.value = Math.min(100, Math.round((100 * t) / duration));
    t += step;
  }

  bakedTracks = tracks;
  bakedDuration = duration;
  progressEl.value = 100;
  statusEl.textContent = "Done.";
  log(`frames: ${totalFrames}, pose detected: ${framesWithPose}/${totalFrames}, any hand detected: ${framesWithHand}/${totalFrames}`);
  log(`bones tracked: ${Object.keys(tracks).length}`);
  saveRow.hidden = false;
}

bakeButton.addEventListener("click", () => {
  bakeButton.disabled = true;
  bake().catch((err) => {
    statusEl.textContent = "Error: " + err.message;
    console.error(err);
  }).finally(() => { bakeButton.disabled = false; });
});

saveButton.addEventListener("click", async () => {
  const name = signNameInput.value.trim();
  if (!name || !bakedTracks) return;
  saveButton.disabled = true;
  try {
    const res = await fetch("/api/save_animation", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, tracks: bakedTracks, duration: bakedDuration }),
    });
    const data = await res.json();
    if (res.ok) {
      statusEl.textContent = `Saved as ${data.saved}`;
    } else {
      statusEl.textContent = "Save failed: " + (data.error || res.status);
    }
  } finally {
    saveButton.disabled = false;
  }
});

loadVideoList();
</script>
</body>
</html>
